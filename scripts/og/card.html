<!doctype html>
<!-- Source for apps/web/public/og-image.png (1200x630 social preview card). Render:
     chrome --headless=new --screenshot=og.png --window-size=1200,630 --hide-scrollbars --force-device-scale-factor=1 file:///.../card.html -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden;background:#131313}
  body{font-family:Inter,sans-serif;color:#fff;position:relative}
  .mark-bg{position:absolute;right:-70px;top:95px;width:520px;height:520px;opacity:.9}
  .wrap{position:absolute;left:88px;top:80px;bottom:76px;width:700px;display:flex;flex-direction:column}
  .brand{display:flex;align-items:center;gap:18px}
  .brand span{font-size:40px;font-weight:600;letter-spacing:-.02em}
  h1{margin-top:auto;font-size:68px;line-height:1.06;font-weight:600;letter-spacing:-.035em}
  h1 em{font-style:normal;color:#8b8cff}
  p{margin-top:26px;font-size:28px;line-height:1.35;color:rgba(255,255,255,.65);letter-spacing:-.01em}
  .foot{margin-top:auto;display:flex;align-items:center;gap:14px;font-family:'JetBrains Mono',monospace;font-size:20px;color:rgba(255,255,255,.5)}
  .dot{width:10px;height:10px;border-radius:50%;background:#5b5bf0}
</style></head><body>
<svg class="mark-bg" viewBox="0 0 32 32" fill="none"><rect x="3" y="3" width="17" height="17" rx="5.5" fill="#5B5BF0"/><rect x="12" y="12" width="17" height="17" rx="5.5" fill="#8B8CFF"/><path d="M12 17.5V12h5.5A2.5 2.5 0 0 1 20 14.5V20h-5.5A2.5 2.5 0 0 1 12 17.5Z" fill="#2E2EA8"/></svg>
<div class="wrap">
  <div class="brand">
    <svg width="64" height="64" viewBox="0 0 32 32" fill="none"><rect x="3" y="3" width="17" height="17" rx="5.5" fill="#5B5BF0"/><rect x="12" y="12" width="17" height="17" rx="5.5" fill="#8B8CFF"/><path d="M12 17.5V12h5.5A2.5 2.5 0 0 1 20 14.5V20h-5.5A2.5 2.5 0 0 1 12 17.5Z" fill="#2E2EA8"/></svg>
    <span>MetaSwap</span>
  </div>
  <h1>Swap, pool and trade with <em>gasless intents</em></h1>
  <p>A full-stack DEX demo on MetaChain Devnet</p>
  <div class="foot"><i class="dot"></i>metaswaplabs.duckdns.org</div>
</div>
