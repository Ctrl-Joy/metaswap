<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#131313" />
    <title>MetaSwap: swap, pool and trade with gasless intents</title>
    <meta name="description" content="MetaSwap: swap, pool and trade with gasless MetaSwapX intents on MetaChain Devnet." />
    <link rel="canonical" href="https://metaswaplabs.duckdns.org/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MetaSwap" />
    <meta property="og:title" content="MetaSwap: swap, pool and trade with gasless intents" />
    <meta property="og:description" content="A full-stack DEX demo on MetaChain Devnet. Swap, pool and trade with gasless MetaSwapX intents." />
    <meta property="og:url" content="https://metaswaplabs.duckdns.org/" />
    <meta property="og:image" content="https://metaswaplabs.duckdns.org/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="MetaSwap logo with the line: Swap, pool and trade with gasless intents" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MetaSwap: swap, pool and trade with gasless intents" />
    <meta name="twitter:description" content="A full-stack DEX demo on MetaChain Devnet. Swap, pool and trade with gasless MetaSwapX intents." />
    <meta name="twitter:image" content="https://metaswaplabs.duckdns.org/og-image.png" />
    <meta name="twitter:image:alt" content="MetaSwap logo with the line: Swap, pool and trade with gasless intents" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script>
      // Apply the persisted theme before first paint (no flash).
      try {
        var s = JSON.parse(localStorage.getItem('metaswap.settings') || '{}')
        if (s.state && s.state.theme) document.documentElement.dataset.theme = s.state.theme
      } catch (e) {}
    </script>
  </head>
  <body>
    <!-- Painted as soon as the stylesheet arrives, before the app script has downloaded, so a phone
         on a slow connection sees the page frame instead of a blank screen. React replaces it. -->
    <div id="root">
      <div style="height: 72px"></div>
      <div role="status" aria-label="Loading MetaSwap" style="display: flex; justify-content: center; padding-top: 128px">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" style="color: var(--ms-text-3, #808080); animation: spin 1s linear infinite">
          <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-opacity="0.25" stroke-width="2.5" />
          <path d="M21 12a9 9 0 0 0-9-9" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
