# MetaSwap contracts.
# Two isolated build profiles let the AMM and the MetaSwapX/router work compile and test
# concurrently without sharing out/ or cache/. The default profile builds everything.
#
#   FOUNDRY_PROFILE=amm forge test     -> src/amm,  test/amm
#   FOUNDRY_PROFILE=x   forge test     -> src/x,    test/x   (may import src/amm)
#   forge build / forge test           -> everything (used for final integration + ABI export)

[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
libs = ["../../lib", "node_modules"]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"
fs_permissions = [{ access = "read-write", path = "./deployments" }, { access = "read", path = "./out" }]
remappings = [
  "forge-std/=../../lib/forge-std/src/",
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
  "solmate/=node_modules/solmate/",
  "@metaswap/amm/=src/amm/",
  "@metaswap/x/=src/x/",
]

[profile.amm]
src = "src/amm"
test = "test/amm"
out = "out-amm"
cache_path = "cache-amm"

[profile.x]
src = "src/x"
test = "test/x"
out = "out-x"
cache_path = "cache-x"

[fmt]
line_length = 120
